[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-forge"
version = "0.1.0"
description = "CLI для генерации структурированных промптов для ИИ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prompt-forge contributors" }]
keywords = ["prompt", "cli", "ai", "prompt-engineering", "vibe-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/nikitu0008-collab/prompt-forge"
Repository = "https://github.com/nikitu0008-collab/prompt-forge"
Issues = "https://github.com/nikitu0008-collab/prompt-forge/issues"

[project.scripts]
prompt-forge = "prompt_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_forge"]

[tool.hatch.build.targets.sdist]
include = ["src/prompt_forge", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
